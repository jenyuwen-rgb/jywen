<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>JYWEN 游泳與數據整合平台</title>
    <style>
        /* macOS & iOS 極簡玻璃美學 Launchpad */
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');

        :root {
            --bg-main:    #0A0A0B;
            --border:     #222225;
            --text-muted: #8E8E93;
            --gold:       #D4AF37;
            --gold-lt:    #FFD933;
            --radius-card: 42px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-main);
            color: #FFF;
            font-family: 'Outfit', 'Noto Sans TC', -apple-system, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* ── 背景星空與漸層桌布 ── */
        .desktop-wallpaper {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, #151518 0%, #0A0A0B 100%);
        }
        .wallpaper-logo {
            font-size: 6.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #D4AF37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0; 
            line-height: 1; /* 消除預設行高產生的上下間距不對稱 */
            opacity: 0.16;
            letter-spacing: 8px;
        }
        .wallpaper-sub {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 5px;
            opacity: 0.18;
            text-transform: uppercase;
            position: absolute;
            transform: translateY(58px); /* 脫離 flex 排版，不影響 JYWEN 主字體的完美置中計算 */
        }

        /* ── Launchpad 2列 3行 正方形按鈕網格容器 ── */
        .launchpad-wrapper {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            transition: opacity 0.4s ease, filter 0.4s ease;
        }

        .launchpad-grid {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            max-width: 980px;
            gap: 32px 28px;
            padding: 32px;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @media (max-width: 960px) {
            .launchpad-grid {
                max-width: 720px;
                gap: 24px;
            }
        }
        @media (max-width: 680px) {
            .launchpad-grid {
                max-width: 420px;
                gap: 16px;
            }
            .launch-card {
                padding: 10px;
                gap: 4px;
            }
            .launch-card-icon {
                width: 115px;
                height: 115px;
            }
            .launch-card-label {
                font-size: 1.25rem;
            }
        }

        /* ── 3D 立體質感正方形卡片樣式 ── */
        .launch-card {
            width: 210px;
            height: 210px;
            flex-shrink: 0;
            background: linear-gradient(165deg, rgba(48, 48, 56, 0.85) 0%, rgba(24, 24, 28, 0.92) 50%, rgba(12, 12, 14, 0.98) 100%);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            /* 3D 頂部受光切角與實體底座 */
            border-top: 1.8px solid rgba(255, 255, 255, 0.35);
            border-left: 1.2px solid rgba(255, 255, 255, 0.18);
            border-right: 1px solid rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(0, 0, 0, 0.7);
            border-radius: var(--radius-card);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            user-select: none;
            position: relative;
            transform-style: preserve-3d;
            /* 物理重力雙重 3D 厚度懸浮陰影 */
            box-shadow: 
                0 8px 0 0 #151518, 
                0 18px 36px rgba(0, 0, 0, 0.65), 
                inset 0 2px 2px rgba(255, 255, 255, 0.3),
                inset 0 -4px 8px rgba(0, 0, 0, 0.7);
        }

        .launch-card:hover {
            transform: translateY(-8px) rotateX(4deg) scale(1.04); /* 3D 懸浮與微透視仰角 */
            background: linear-gradient(165deg, rgba(62, 62, 72, 0.95) 0%, rgba(32, 32, 38, 0.96) 50%, rgba(16, 16, 20, 0.98) 100%);
            border-top-color: rgba(255, 217, 51, 0.6);
            border-left-color: rgba(255, 217, 51, 0.3);
            /* 3D 金色呼吸沉澱發光與厚度延伸 */
            box-shadow: 
                0 14px 0 0 #1e1e24, 
                0 28px 56px rgba(0, 0, 0, 0.8), 
                0 0 35px rgba(212, 175, 55, 0.35),
                inset 0 2.5px 3px rgba(255, 255, 255, 0.45),
                inset 0 -4px 8px rgba(0, 0, 0, 0.6);
        }

        /* 點選時真實物理向下凹陷按壓 */
        .launch-card:active {
            transform: translateY(6px) scale(0.96);
            box-shadow: 
                0 2px 0 0 #0d0d0f, 
                0 6px 12px rgba(0, 0, 0, 0.5), 
                0 0 12px rgba(212, 175, 55, 0.2),
                inset 0 4px 10px rgba(0, 0, 0, 0.85);
        }

        /* ── 統一高質感 3D 浮雕圖示 ── */
        .icon-box {
            width: 125px;
            height: 125px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 4px;
        }

        .launch-card-icon {
            width: 115px;
            height: 115px;
            object-fit: contain;
            transition: transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
            filter: drop-shadow(0 10px 12px rgba(0, 0, 0, 0.65));
        }

        .launch-card:hover .launch-card-icon {
            transform: translateY(-4px) scale(1.06);
            filter: drop-shadow(0 16px 18px rgba(0, 0, 0, 0.85));
        }

        /* 水平與垂直 100% 絕對對齊之文字標籤 (100% 強制單行不斷行) */
        .launch-card-label {
            font-size: 1.15rem;
            font-weight: 800;
            color: #AEAEB2;
            letter-spacing: 0px;
            white-space: nowrap !important;
            word-break: keep-all !important;
            overflow: visible;
            text-align: center;
            display: block !important;
            width: 100% !important;
            margin-top: 6px;
            margin-bottom: 2px;
            line-height: 1.2;
            transition: color 0.3s;
        }

        .launch-card:hover .launch-card-label {
            color: #F2F2F7;
        }

        /* ── 離心散射彈開與淡出動畫 (Explosion Effect) ── */
        .launchpad-grid.has-active-card .launch-card {
            opacity: 0;
            filter: blur(10px);
            pointer-events: none;
        }

        /* 6張卡片依位置向外散射，規模與動態極致和諧 */
        .launchpad-grid.has-active-card .launch-card.card-0 { transform: translate3d(-240px, -240px, 0) scale(0.3); }
        .launchpad-grid.has-active-card .launch-card.card-1 { transform: translate3d(0, -280px, 0) scale(0.3); }
        .launchpad-grid.has-active-card .launch-card.card-2 { transform: translate3d(240px, -240px, 0) scale(0.3); }
        .launchpad-grid.has-active-card .launch-card.card-3 { transform: translate3d(-240px, 240px, 0) scale(0.3); }
        .launchpad-grid.has-active-card .launch-card.card-4 { transform: translate3d(0, 280px, 0) scale(0.3); }
        .launchpad-grid.has-active-card .launch-card.card-5 { transform: translate3d(240px, 240px, 0) scale(0.3); }

        /* ── 全螢幕分頁內容容器 (Scale & Fade Expansion) ── */
        .content-container {
            position: absolute;
            inset: 0;
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.1);
            transform-origin: center center;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
        }

        .content-container.expanded {
            pointer-events: auto;
            opacity: 1;
            transform: scale(1);
        }

        /* 內置 iframe 分頁，延續 zero-reload 的 3D 位移隱藏技術 */
        .tab-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            visibility: hidden;
            pointer-events: none;
            transform: translate3d(-9999px, 0, 0);
            background-color: var(--bg-main);
        }
        
        .tab-panel.active {
            visibility: visible;
            pointer-events: auto;
            transform: translate3d(0, 0, 0);
        }

        /* ── 右上角極簡圓形毛玻璃關閉按鈕 ✕ ── */
        .close-tab-btn {
            position: fixed;
            top: 24px;
            right: 24px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(30, 30, 32, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #AEAEB2;
            font-size: 18px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 999;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            box-shadow: 0 6px 20px rgba(0,0,0,0.35);
        }

        .close-tab-btn:hover {
            color: #F2F2F7;
            background: rgba(44, 44, 46, 0.9);
            border-color: rgba(255, 255, 255, 0.16);
            transform: scale(1.08);
        }

        .close-tab-btn:active {
            transform: scale(0.95);
        }

        .close-tab-btn.visible {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        /* 浮水印版本號 */
        .version-badge {
            position: absolute;
            bottom: 16px;
            right: 16px;
            font-size: 0.72rem;
            color: #27272A;
            font-family: monospace;
            z-index: 2;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- ── 全域 SVG 漸層色彩定義 (白金-黃金金屬拉絲質感) ── -->
    <svg width="0" height="0" style="position: absolute; pointer-events: none; left: -9999px;">
        <defs>
            <linearGradient id="iconGoldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FFFFFF" />
                <stop offset="40%" stop-color="#F5D384" />
                <stop offset="100%" stop-color="#D4AF37" />
            </linearGradient>
        </defs>
    </svg>

    <!-- 桌面極簡背景壁紙 -->
    <div class="desktop-wallpaper">
        <div class="wallpaper-logo">JYWEN</div>
        <div class="wallpaper-sub">Swim & Finance Hub</div>
    </div>

    <!-- 版本號浮水印 -->
    <div class="version-badge">v6.2.0</div>

    <!-- ── Launchpad 2列 3行 正方形按鈕網格 ── -->
    <div class="launchpad-wrapper" id="launchpad-wrapper">
        <div class="launchpad-grid" id="launchpad-grid">
            
            <!-- 1. 整合平台 -->
            <div class="launch-card card-0" onclick="switchTab('manage', this)">
                <div class="icon-box"><img class="launch-card-icon" src="static/integration_icon.png?v=2" alt="整合平台" /></div>
                <span class="launch-card-label" style="display:block !important; width:100% !important; text-align:center !important; white-space:nowrap !important; word-break:keep-all !important; letter-spacing:-0.2px !important; font-size:17px !important; font-weight:800 !important; margin-top:6px;">整合平台</span>
            </div>

            <!-- 2. 游泳成績查詢 -->
            <div class="launch-card card-1" onclick="switchTab('query', this)">
                <div class="icon-box"><img class="launch-card-icon" src="static/swimming_icon.png?v=2" alt="游泳成績" /></div>
                <span class="launch-card-label" style="display:block !important; width:100% !important; text-align:center !important; white-space:nowrap !important; word-break:keep-all !important; letter-spacing:-0.2px !important; font-size:17px !important; font-weight:800 !important; margin-top:6px;">游泳成績</span>
            </div>

            <!-- 3. 檢視資料庫 -->
            <div class="launch-card card-2" onclick="switchTab('view_db', this)">
                <div class="icon-box"><img class="launch-card-icon" src="static/db_icon.png?v=2" alt="檢視資料庫" /></div>
                <span class="launch-card-label" style="display:block !important; width:100% !important; text-align:center !important; white-space:nowrap !important; word-break:keep-all !important; letter-spacing:-0.2px !important; font-size:17px !important; font-weight:800 !important; margin-top:6px;">檢視資料庫</span>
            </div>

            <!-- 4. 理財分析 -->
            <div class="launch-card card-3" onclick="switchTab('wealth', this)">
                <div class="icon-box"><img class="launch-card-icon" src="static/wealth_icon.png?v=2" alt="理財分析" /></div>
                <span class="launch-card-label" style="display:block !important; width:100% !important; text-align:center !important; white-space:nowrap !important; word-break:keep-all !important; letter-spacing:-0.2px !important; font-size:17px !important; font-weight:800 !important; margin-top:6px;">理財分析</span>
            </div>

            <!-- 5. 車價分析 -->
            <div class="launch-card card-4" onclick="switchTab('car', this)">
                <div class="icon-box"><img class="launch-card-icon" src="static/car_icon.png?v=2" alt="車價分析" /></div>
                <span class="launch-card-label" style="display:block !important; width:100% !important; text-align:center !important; white-space:nowrap !important; word-break:keep-all !important; letter-spacing:-0.2px !important; font-size:17px !important; font-weight:800 !important; margin-top:6px;">車價分析</span>
            </div>

            <!-- 6. 系統訊息 -->
            <div class="launch-card card-5" onclick="switchTab('system_messages', this)">
                <div class="icon-box"><img class="launch-card-icon" src="static/system_messages_icon.png?v=2" alt="系統訊息" /></div>
                <span class="launch-card-label" style="display:block !important; width:100% !important; text-align:center !important; white-space:nowrap !important; word-break:keep-all !important; letter-spacing:-0.2px !important; font-size:17px !important; font-weight:800 !important; margin-top:6px;">系統訊息</span>
            </div>

            <!-- 7. AZ 搬遷分析 -->
            <div class="launch-card card-6" onclick="switchTab('az_study', this)">
                <div class="icon-box"><img class="launch-card-icon" src="static/az_study_icon.png?v=2" alt="AZ 搬遷分析" /></div>
                <span class="launch-card-label" style="display:block !important; width:100% !important; text-align:center !important; white-space:nowrap !important; word-break:keep-all !important; letter-spacing:-0.2px !important; font-size:17px !important; font-weight:800 !important; margin-top:6px;">AZ 搬遷分析</span>
            </div>

        </div>
    </div>

    <!-- 右上角圓形關閉按鈕 ✕ -->
    <button class="close-tab-btn" id="close-tab-btn" onclick="closeActiveTab()" title="返回主頁面">✕</button>

    <!-- 全螢幕分頁內容容器 (iframe zero-reload 容器) -->
    <div class="content-container" id="content-container">
        <iframe id="iframe-manage" class="tab-panel" src=""></iframe>
        <iframe id="iframe-query" class="tab-panel" src=""></iframe>
        <iframe id="iframe-view_db" class="tab-panel" src=""></iframe>
        <iframe id="iframe-wealth" class="tab-panel" src=""></iframe>
        <iframe id="iframe-car" class="tab-panel" src=""></iframe>
        <iframe id="iframe-system_messages" class="tab-panel" src=""></iframe>
        <iframe id="iframe-az_study" class="tab-panel" src=""></iframe>
    </div>

    <script>
        const tabUrls = {
            'manage': '/manage.html',
            'query': '/query.html',
            'view_db': '/view_db.html',
            'wealth': '/wealth.html',
            'car': '/car.html',
            'system_messages': '/system_messages.html',
            'az_study': '/az_presentation'
        };
        
        const loadedTabs = {};
        let activeTabId = null;

        // ── 點擊正方形按鈕：展開分頁 ──
        function switchTab(tabId, cardEl = null) {
            const grid = document.getElementById('launchpad-grid');
            const container = document.getElementById('content-container');
            const closeBtn = document.getElementById('close-tab-btn');

            activeTabId = tabId;

            // 1. 如果有傳入卡片節點，動態計算放大原點 (transformOrigin)
            if (cardEl) {
                const rect = cardEl.getBoundingClientRect();
                const originX = rect.left + rect.width / 2;
                const originY = rect.top + rect.height / 2;
                container.style.transformOrigin = `${originX}px ${originY}px`;
            } else {
                // 如果無卡片（如跨頁面跳轉），則預設從對應卡片或視窗中央膨脹
                const matchedCard = document.querySelector(`.launch-card.card-${getCardIndex(tabId)}`);
                if (matchedCard) {
                    const rect = matchedCard.getBoundingClientRect();
                    container.style.transformOrigin = `${rect.left + rect.width / 2}px ${rect.top + rect.height / 2}px`;
                } else {
                    container.style.transformOrigin = 'center center';
                }
            }

            // 2. 啟動離心散射與淡出動畫
            grid.classList.add('has-active-card');

            // 3. 延遲加載 iframe (Lazy load)
            const targetIframe = document.getElementById(`iframe-${tabId}`);
            if (targetIframe) {
                if (!loadedTabs[tabId]) {
                    targetIframe.src = tabUrls[tabId];
                    loadedTabs[tabId] = true;
                }
                
                // 4. 切換 active iframe
                document.querySelectorAll('.tab-panel').forEach(p => {
                    if (p.id === `iframe-${tabId}`) {
                        p.classList.add('active');
                    } else {
                        p.classList.remove('active');
                    }
                });

                // 5. 展開分頁內容，並顯示右上角關閉鍵
                container.classList.add('expanded');
                closeBtn.classList.add('visible');
            }
        }

        // ── 點擊關閉按鈕：坍縮回 Launchpad ──
        function closeActiveTab() {
            const grid = document.getElementById('launchpad-grid');
            const container = document.getElementById('content-container');
            const closeBtn = document.getElementById('close-tab-btn');

            if (!activeTabId) return;

            // 1. 收合面板（向原點坍縮）與隱藏關閉鍵
            container.classList.remove('expanded');
            closeBtn.classList.remove('visible');

            // 2. 收攏其餘卡片（卡片淡入並歸位）
            grid.classList.remove('has-active-card');

            // 3. 延遲重設活動 ID
            setTimeout(() => {
                activeTabId = null;
            }, 500);
        }

        // 輔助獲取分頁對應的卡片 Index
        function getCardIndex(tabId) {
            const indices = {
                'manage': 0,
                'query': 1,
                'view_db': 2,
                'wealth': 3,
                'car': 4,
                'system_messages': 5
            };
            return indices[tabId] !== undefined ? indices[tabId] : 0;
        }
        
        // 監聽來自子分頁頂部導覽列跳轉的 postMessage 跨分頁調用
        window.addEventListener('message', (event) => {
            const targetTabId = event.data.switchTab;
            if (targetTabId) {
                // 如果跳轉的目標與當前不一致，先順滑收起當前，再從新卡片原點彈出
                if (activeTabId !== targetTabId) {
                    closeActiveTab();
                    setTimeout(() => {
                        switchTab(targetTabId);
                    }, 400); // 配合收起動畫耗時，呈現完美的跳躍彈出視覺
                }
            }
        });
    </script>
</body>
</html>
